[workspace]
members = [
  "crates/core",
  "crates/services",
  "crates/foundation",
  "crates/foundation-platform",
  "crates/ui",
  "crates/features/render_cpu",
  "crates/features/render_gpu",
  "crates/features/settings",
  "crates/features/shell_integration",
  "crates/features/diagnostics",
  "crates/app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["rldyourmnd"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
portable-pty = "0.8"
winit = "0.30"
wgpu = "0.20"
arboard = "3.4"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "sync", "time"] }
