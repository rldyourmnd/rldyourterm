[workspace]
members = [
  "crates/core",
  "crates/services",
  "crates/foundation",
  "crates/foundation-platform",
  "crates/ui",
  "crates/features/render_cpu",
  "crates/features/render_gpu",
  "crates/features/font",
  "crates/features/settings",
  "crates/features/shell_integration",
  "crates/features/diagnostics",
  "crates/app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["rldyourmnd"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
portable-pty = "0.9"
winit = "0.30"
wgpu = "28.0"
arboard = "3.6"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
softbuffer = "0.4"
font8x8 = "0.3"
fontdue = "0.9"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
