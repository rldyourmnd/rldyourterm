name: Setup Rust CI
description: Install Rust toolchain, restore cache, and install Linux build dependencies for CI jobs.

inputs:
  toolchain:
    description: Rust toolchain version to install.
    required: true
  components:
    description: Optional rustup components to install.
    required: false
    default: ""
  targets:
    description: Optional rustup targets to install.
    required: false
    default: ""
  shared-key:
    description: Shared rust-cache key.
    required: true
  save-if:
    description: rust-cache save-if expression result.
    required: false
    default: "false"
  cache-targets:
    description: Whether rust-cache should cache target directories.
    required: false
    default: "true"
  linux-packages:
    description: Space-delimited Linux apt packages to install.
    required: false
    default: "libxkbcommon-dev libwayland-dev"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - uses: Swatinem/rust-cache@c676846f29d98ff6b0106d3608c7ffd4048af17b
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
        cache-targets: ${{ inputs.cache-targets }}

    - name: Install system dependencies (Linux)
      if: ${{ runner.os == 'Linux' && inputs.linux-packages != '' }}
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ${{ inputs.linux-packages }}
