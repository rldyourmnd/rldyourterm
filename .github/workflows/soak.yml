name: Soak Matrix

on:
  schedule:
    - cron: "0 4 * * 0" # Weekly on Sunday at 04:00 UTC
  workflow_dispatch:
    inputs:
      repeat:
        description: "Matrix repeat count for long-run compatibility soak"
        required: false
        default: "3"
        type: string

concurrency:
  group: soak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: "5"
  CARGO_INCREMENTAL: "0"
  CI_RUST_TOOLCHAIN: "1.94.0"

jobs:
  soak:
    name: Soak (AI CLI matrix)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          shared-key: soak-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          linux-packages: libxkbcommon-dev libwayland-dev fish zsh
      - name: Run AI CLI compatibility soak matrix
        env:
          SOAK_REPEAT: ${{ github.event_name == 'workflow_dispatch' && inputs.repeat || '3' }}
        run: |
          set -euo pipefail
          bash scripts/mvp/run_matrix.sh "$SOAK_REPEAT"
      - name: Upload soak artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: soak-matrix-${{ github.run_id }}
          path: scripts/mvp/output/
          if-no-files-found: warn
