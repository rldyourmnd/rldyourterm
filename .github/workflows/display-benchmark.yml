name: Display Benchmark

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to benchmark"
        required: true
        default: "main"
        type: string
      runner_os:
        description: "Self-hosted runner OS label"
        required: true
        default: "linux"
        type: choice
        options:
          - linux
          - macos
      scale:
        description: "Benchmark scale"
        required: true
        default: "standard"
        type: choice
        options:
          - quick
          - standard
          - stress
      comparison_mode:
        description: "Baseline comparison policy for the generated controlled baseline"
        required: true
        default: "advisory"
        type: choice
        options:
          - advisory
          - enforced
      required_session_type:
        description: "Optional required session type for controlled validation"
        required: false
        default: ""
        type: string
      required_display_server_hint:
        description: "Optional required display server hint for controlled validation"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  controlled-display-calibration:
    name: Controlled Display Calibration
    runs-on:
      - self-hosted
      - display-benchmark
      - ${{ inputs.runner_os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_NET_RETRY: "5"
      CARGO_INCREMENTAL: "0"
      CI_RUST_TOOLCHAIN: "1.94.0"
      TERMINAL_DISPLAY_BENCHMARK_SCALE: ${{ inputs.scale }}
      TERMINAL_DISPLAY_BENCHMARK_COMPARISON_MODE: ${{ inputs.comparison_mode }}
      TERMINAL_DISPLAY_BENCHMARK_REQUIRED_SESSION_TYPE: ${{ inputs.required_session_type }}
      TERMINAL_DISPLAY_BENCHMARK_REQUIRED_DISPLAY_SERVER_HINT: ${{ inputs.required_display_server_hint }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # master
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c676846f29d98ff6b0106d3608c7ffd4048af17b # v2.9.0
        with:
          shared-key: display-benchmark-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: "false"
      - name: Validate display benchmark runner readiness
        run: |
          mkdir -p target/terminal-benchmark
          bash scripts/ci/run_terminal_display_benchmark_runner_readiness.sh \
            target/terminal-benchmark/live-display-runner-readiness.json
      - name: Run controlled display calibration
        run: |
          bash scripts/ci/run_terminal_display_benchmark_calibration.sh \
            target/terminal-benchmark/live-display-controlled-report.json \
            target/terminal-benchmark/live-display-controlled-baseline.json \
            target/terminal-benchmark/live-display-controlled-calibration.json \
            target/terminal-benchmark/live-display-runner-readiness.json
      - name: Upload calibration artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-display-calibration-${{ inputs.runner_os }}-${{ inputs.scale }}
          if-no-files-found: warn
          path: |
            target/terminal-benchmark/live-display-runner-readiness.json
            target/terminal-benchmark/live-display-controlled-report.json
            target/terminal-benchmark/live-display-controlled-baseline.json
            target/terminal-benchmark/live-display-controlled-calibration.json
