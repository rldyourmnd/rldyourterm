name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: cflite-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-fuzzing:
    name: PR Fuzz (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Build fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true

  fuzz-gate:
    name: ClusterFuzzLite PR fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [pr-fuzzing]
    steps:
      - name: Validate PR fuzzing job result
        run: |
          case "${{ needs.pr-fuzzing.result }}" in
            success)
              ;;
            *)
              echo "ClusterFuzzLite PR fuzzing gate blocked by upstream result: ${{ needs.pr-fuzzing.result }}" >&2
              exit 1
              ;;
          esac
