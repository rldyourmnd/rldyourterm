# CodeQL Security Analysis (Free for public repos)
# https://github.com/github/codeql-action

name: CodeQL

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: "5"
  CARGO_INCREMENTAL: "0"
  CI_RUST_TOOLCHAIN: "1.94.0"
  # Keep CodeQL metric drift fail-closed while allowing known benign generated warnings.
  CODEQL_MAX_EXTRACTED_WITH_ERRORS: "5"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@0d579ffd059c29b07949a3cce3983f0780820c98 # v4
        with:
          languages: rust
          queries: security-and-quality

      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          shared-key: ci-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: "false"

      - name: Build
        run: cargo build --workspace --locked

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@0d579ffd059c29b07949a3cce3983f0780820c98 # v4
        with:
          category: "/language:rust"

      - name: Collect Rust extraction diagnostics
        if: ${{ always() }}
        run: bash scripts/ci/codeql_collect_rust_diagnostics.sh codeql-rust-diagnostics

      - name: Upload Rust extraction diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: codeql-rust-diagnostics-${{ github.run_id }}
          path: codeql-rust-diagnostics
          if-no-files-found: error

      - name: Publish extraction diagnostics summary
        if: ${{ always() }}
        run: |
          if [ -f codeql-rust-diagnostics/summary.md ]; then
            cat codeql-rust-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CodeQL diagnostics summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce actionable extraction diagnostics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          status_file="codeql-rust-diagnostics/status.env"
          if [ ! -f "${status_file}" ]; then
            echo "::error::CodeQL diagnostics status file is missing; enforcement cannot continue."
            exit 1
          fi

          # shellcheck source=/dev/null
          source "${status_file}"

          errors="${CODEQL_EXTRACTION_ERROR_ROWS:-0}"
          actionable="${CODEQL_ACTIONABLE_EXTRACTION_WARNING_ROWS:-0}"
          extracted_with_errors_metric="${CODEQL_EXTRACTED_WITH_ERRORS_METRIC:-0}"
          extracted_with_errors_budget="${CODEQL_MAX_EXTRACTED_WITH_ERRORS:-0}"
          case "${errors}" in
            ''|*[!0-9]*)
              echo "::error::Invalid CODEQL_EXTRACTION_ERROR_ROWS='${errors}' in ${status_file}."
              exit 1
              ;;
          esac
          case "${actionable}" in
            ''|*[!0-9]*)
              echo "::error::Invalid CODEQL_ACTIONABLE_EXTRACTION_WARNING_ROWS='${actionable}' in ${status_file}."
              exit 1
              ;;
          esac
          case "${extracted_with_errors_metric}" in
            ''|*[!0-9]*)
              echo "::error::Invalid CODEQL_EXTRACTED_WITH_ERRORS_METRIC='${extracted_with_errors_metric}' in ${status_file}."
              exit 1
              ;;
          esac
          case "${extracted_with_errors_budget}" in
            ''|*[!0-9]*)
              echo "::error::Invalid CODEQL_MAX_EXTRACTED_WITH_ERRORS='${extracted_with_errors_budget}' in workflow env."
              exit 1
              ;;
          esac

          echo "CodeQL extraction diagnostics enforcement: errors=${errors}, actionable_warnings=${actionable}, extracted_with_errors_metric=${extracted_with_errors_metric}, extracted_with_errors_budget=${extracted_with_errors_budget}"
          if [ "${errors}" -gt 0 ] || [ "${actionable}" -gt 0 ]; then
            echo "::error::Actionable CodeQL extraction diagnostics detected."
            exit 1
          fi
          if [ "${extracted_with_errors_metric}" -gt "${extracted_with_errors_budget}" ]; then
            echo "::error::CodeQL extracted-with-errors metric (${extracted_with_errors_metric}) exceeded budget (${extracted_with_errors_budget})."
            exit 1
          fi

  codeql-gate:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [analyze]
    steps:
      - name: Validate CodeQL job result
        run: |
          case "${{ needs.analyze.result }}" in
            success)
              ;;
            *)
              echo "CodeQL gate blocked by upstream result: ${{ needs.analyze.result }}" >&2
              exit 1
              ;;
          esac
