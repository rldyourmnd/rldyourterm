# CodeQL Security Analysis (Free for public repos)
# https://github.com/github/codeql-action

name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 02:00 UTC

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: "5"
  CARGO_INCREMENTAL: "0"
  CI_RUST_TOOLCHAIN: "1.94.0"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@0d579ffd059c29b07949a3cce3983f0780820c98
        with:
          languages: rust
          queries: security-and-quality

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          shared-key: ci-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          # Cache is authored by the main CI `check` job to avoid cross-workflow races.
          save-if: "false"

      - name: Install system dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libxkbcommon-dev libwayland-dev

      - name: Build
        run: cargo build --workspace --locked

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@0d579ffd059c29b07949a3cce3983f0780820c98
        with:
          category: "/language:rust"

      - name: Collect Rust extraction diagnostics
        if: ${{ always() }}
        run: bash scripts/ci/codeql_collect_rust_diagnostics.sh codeql-rust-diagnostics

      - name: Upload Rust extraction diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-rust-diagnostics-${{ github.run_id }}
          path: codeql-rust-diagnostics
          if-no-files-found: warn

      - name: Publish extraction diagnostics summary
        if: ${{ always() }}
        run: |
          if [ -f codeql-rust-diagnostics/summary.md ]; then
            cat codeql-rust-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CodeQL diagnostics summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce actionable extraction diagnostics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          status_file="codeql-rust-diagnostics/status.env"
          if [ ! -f "${status_file}" ]; then
            echo "::warning::CodeQL diagnostics status file is missing; enforcement skipped."
            exit 0
          fi

          # shellcheck source=/dev/null
          source "${status_file}"

          errors="${CODEQL_EXTRACTION_ERROR_ROWS:-0}"
          actionable="${CODEQL_ACTIONABLE_EXTRACTION_WARNING_ROWS:-0}"

          echo "CodeQL extraction diagnostics enforcement: errors=${errors}, actionable_warnings=${actionable}"
          if [ "${errors}" -gt 0 ] || [ "${actionable}" -gt 0 ]; then
            echo "::error::Actionable CodeQL extraction diagnostics detected."
            exit 1
          fi
