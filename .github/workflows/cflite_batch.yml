name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    - cron: "0 3 * * 0" # Weekly on Sunday at 03:00 UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: cflite-batch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  batch-fuzzing:
    name: Batch fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # 2024-09-19
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address

      - name: Run batch fuzzing
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # 2024-09-19
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1800
          mode: batch
          sanitizer: address
          output-sarif: true
