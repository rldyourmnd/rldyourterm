name: PR Automation

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: pr-automation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Detect dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status="$(gh api repos/${{ github.repository }} --jq '.security_and_analysis.dependency_graph.status // "unknown"' || echo unknown)"
          if [ "$status" = "enabled" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Dependency graph status is '$status'; dependency review will be skipped."
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: steps.dependency-graph.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        if: steps.dependency-graph.outputs.enabled == 'true'

      - name: Skip reason
        if: steps.dependency-graph.outputs.enabled != 'true'
        run: |
          echo "Dependency review skipped because dependency graph is not enabled for this repository." >> "$GITHUB_STEP_SUMMARY"

  labeler:
    name: Label PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b
        with:
          configuration-path: .github/labeler.yml
