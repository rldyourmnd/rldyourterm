name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: "5"
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  CI_RUST_TOOLCHAIN: "1.94.0"
  MSRV_RUST_TOOLCHAIN: "1.92.0"

jobs:
  # ==================== Platform Matrix Jobs ====================

  check:
    name: Check (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Validate ClusterFuzzLite toolchain pin sync
        run: bash scripts/ci/validate_cflite_toolchain_pin.sh
      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          shared-key: ci-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Governance policy gates (CI mode)
        run: bash scripts/ci/run_e2e_governance.sh --mode ci
      - run: cargo check --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          shared-key: ci-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.os == 'macos-14' }}
      - run: cargo test --workspace --locked

  # ==================== Code Coverage ====================

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ vars.CODECOV_ENABLED == 'true' }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          components: llvm-tools-preview
          shared-key: ci-coverage-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@64c5c20c872907b6f7cd50994ac189e7274160f2 # v2.68.26
        with:
          tool: cargo-llvm-cov@0.8.4
      - name: Generate coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Upload to codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  # ==================== Lint & Format ====================

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          components: clippy
          shared-key: ci-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: "false"
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  benchmark-smoke:
    name: Benchmark Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          shared-key: ci-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: "false"
      - name: Benchmark helper unit tests
        run: bash scripts/ci/run_python_ci_unittests.sh
      - run: bash scripts/ci/run_terminal_benchmark_smoke.sh

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ==================== MSRV Check ====================

  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: ${{ env.MSRV_RUST_TOOLCHAIN }}
          shared-key: ci-${{ runner.os }}-${{ env.MSRV_RUST_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  # ==================== Security ====================

  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          shared-key: ci-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: "false"
          cache-targets: false
          linux-packages: ""
      - name: Install cargo-audit
        uses: taiki-e/install-action@64c5c20c872907b6f7cd50994ac189e7274160f2 # v2.68.26
        with:
          tool: cargo-audit@0.22.1
      - name: Run cargo-audit
        run: cargo audit

  # ==================== Dependency Linting ====================

  deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979
        with:
          command: check bans licenses advisories sources

  # Branch protection expects a required check named exactly "CI".
  ci-gate:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [check, test, coverage, clippy, benchmark-smoke, fmt, msrv, audit, deny]
    steps:
      - name: Validate fan-out job results
        run: |
          set -euo pipefail
          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "CI gate blocked: '$name' must be success, got '$result'" >&2
              exit 1
            fi
          }

          require_success "check" "${{ needs.check.result }}"
          require_success "test" "${{ needs.test.result }}"
          require_success "clippy" "${{ needs.clippy.result }}"
          require_success "benchmark-smoke" "${{ needs.benchmark-smoke.result }}"
          require_success "fmt" "${{ needs.fmt.result }}"
          require_success "msrv" "${{ needs.msrv.result }}"
          require_success "audit" "${{ needs.audit.result }}"
          require_success "deny" "${{ needs.deny.result }}"

          case "${{ needs.coverage.result }}" in
            success|skipped)
              ;;
            *)
              echo "CI gate blocked: 'coverage' must be success or skipped, got '${{ needs.coverage.result }}'" >&2
              exit 1
              ;;
          esac
