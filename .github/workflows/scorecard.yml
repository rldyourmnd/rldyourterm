# OpenSSF Scorecard (Free for public repos)
# https://github.com/ossf/scorecard-action

name: Scorecard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'planning/**'
      - '**/*.md'
      - 'assets/**'
  schedule:
    - cron: '0 0 * * 0'  # Weekly at 00:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Security Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload raw Scorecard SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: results.sarif

  upload-sarif:
    name: Upload Normalized Scorecard SARIF
    needs: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - name: Download Scorecard SARIF artifact
        uses: actions/download-artifact@v4
        with:
          name: scorecard-sarif

      - name: Normalize non-URI placeholder artifact paths
        run: |
          jq '
            (.runs[]?.results[]?.locations[]?.physicalLocation?.artifactLocation?.uri) |=
              (if . == "no file associated with this alert"
               then "scorecard://no-file-associated-with-this-alert"
               else .
               end)
          ' results.sarif > results.normalized.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.normalized.sarif
