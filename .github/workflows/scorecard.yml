# OpenSSF Scorecard (Free for public repos)
# https://github.com/ossf/scorecard-action

name: Scorecard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 0 * * 0' # Weekly at 00:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Security Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  # Branch protection expects a required check named exactly "Scorecard".
  scorecard-gate:
    name: Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [scorecard]
    steps:
      - name: Validate scorecard job result
        run: |
          case "${{ needs.scorecard.result }}" in
            success|skipped)
              ;;
            *)
              echo "Scorecard gate blocked by upstream result: ${{ needs.scorecard.result }}" >&2
              exit 1
              ;;
          esac
