# OpenSSF Scorecard (Free for public repos)
# https://github.com/ossf/scorecard-action

name: Scorecard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly at 00:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Security Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize non-URI placeholder artifact paths
        run: |
          jq '
            (.runs[]?.results[]?.locations[]?.physicalLocation?.artifactLocation?.uri) |=
              (if . == "no file associated with this alert"
               then "no-file-associated-with-this-alert"
               else .
               end)
          ' results.sarif > results.normalized.sarif

      - name: Filter non-actionable maturity checks from SARIF
        run: |
          jq '
            .runs |= map(
              .results |= map(
                select(.ruleId != "MaintainedID")
                | select(.ruleId != "CodeReviewID")
                | select(.ruleId != "CIIBestPracticesID")
              )
              | (.tool.driver.rules |= ((. // []) | map(
                  select(.id != "MaintainedID")
                  | select(.id != "CodeReviewID")
                  | select(.id != "CIIBestPracticesID")
                )))
            )
          ' results.normalized.sarif > results.filtered.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: scorecard-sarif
          path: results.filtered.sarif
          retention-days: 5

      - name: Upload SARIF results
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@dd677812177e0c29f9c970a6c58d8607ae1bfefd # v4
        with:
          sarif_file: results.filtered.sarif

  # Branch protection expects a required check named exactly "Scorecard".
  scorecard-gate:
    name: Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [scorecard]
    steps:
      - name: Validate scorecard job result
        run: |
          case "${{ needs.scorecard.result }}" in
            success)
              ;;
            *)
              echo "Scorecard gate blocked by upstream result: ${{ needs.scorecard.result }}" >&2
              exit 1
              ;;
          esac
