# OpenSSF Scorecard (Free for public repos)
# https://github.com/ossf/scorecard-action

name: Scorecard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'planning/**'
      - '**/*.md'
      - 'assets/**'
  schedule:
    - cron: '0 0 * * 0' # Weekly at 00:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Security Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize non-URI placeholder artifact paths
        run: |
          jq '
            (.runs[]?.results[]?.locations[]?.physicalLocation?.artifactLocation?.uri) |=
              (if . == "no file associated with this alert"
               then "no-file-associated-with-this-alert"
               else .
               end)
          ' results.sarif > results.normalized.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4
        with:
          sarif_file: results.normalized.sarif
