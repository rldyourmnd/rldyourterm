name: ClusterFuzzLite batch fuzzing

# Scheduled ClusterFuzzLite batch fuzzing. Replaces the bespoke cflite_batch.yml
# with the reusable clusterfuzzlite.yml in NDDev-it-com/ci-workflows (pinned to
# a SHA).

on:
  schedule:
    - cron: "0 3 * * 0" # Weekly on Sunday at 03:00 UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: cflite-batch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  batch-fuzzing:
    name: Batch fuzzing
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/clusterfuzzlite.yml@ca538d59aef41c1bb03c3669366c368128d5af88
    with:
      runner: ubuntu-24.04
      mode: batch
      language: rust
      sanitizer_matrix: '["address"]'
      fuzz_seconds: 1800
      output_sarif: true
      timeout_minutes: 90
