# Enforce Conventional Commits for PR titles
# https://github.com/amannn/action-semantic-pull-request

name: Semantic PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            perf
            style
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$  # Don't start with uppercase
          message: |
            PR title must follow [Conventional Commits](https://www.conventionalcommits.org/).
            
            Examples:
            - `feat(render): add GPU atlas optimization`
            - `fix(parser): handle multi-param CSI sequences`
            - `docs: update README with build instructions`
