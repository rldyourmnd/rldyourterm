# Enforce Conventional Commits for PR titles
# https://github.com/amannn/action-semantic-pull-request

name: Semantic PR

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  pull-requests: read

concurrency:
  group: semantic-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  semantic:
    name: Semantic PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Satisfy merge queue required check
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          echo "merge_group does not expose pull request title metadata"
          echo "Semantic PR validation is enforced on pull_request; merge queue only requires the status context."
      - name: Support manual workflow dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Semantic PR workflow dispatch does not validate PR metadata."
      - if: ${{ github.event_name == 'pull_request' }}
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            ci
            build
            perf
            style
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$  # Don't start with uppercase
